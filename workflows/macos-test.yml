name: Docker Compose macOS Compatibility Test


on:

  push:

  pull_request:



jobs:


  docker-test:


    runs-on:

      macos-latest



    steps:


    - name: Checkout

      uses: actions/checkout@v4





    - name: Check Environment


      run:

        |

        docker --version

        docker compose version





    - name: Start Docker Compose Test


      run:

        |

        docker compose up -d postgres mysql





    - name: Wait Containers


      run:

        |

        docker compose ps





    - name: Run Compatibility Test


      run:

        |

        python3 scripts/test_compose.py





    - name: Show Logs When Failed


      if: failure()


      run:

        |

        docker compose logs





    - name: Cleanup


      if: always()


      run:

        |

        docker compose down -v
