version: "3.8"

services:

  postgres:
    image: postgres:15
    container_name: test-postgres

    environment:
      POSTGRES_DB: agent
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: secret

    ports:
      - "5432:5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U agent -d agent"
        ]
      interval: 10s
      timeout: 5s
      retries: 30


  mysql:

    image: mysql:8.0

    container_name: test-mysql

    environment:

      MYSQL_DATABASE: agent

      MYSQL_USER: agent

      MYSQL_PASSWORD: secret

      MYSQL_ROOT_PASSWORD: rootsecret


    ports:

      - "3306:3306"


    command:

      --default-authentication-plugin=mysql_native_password


    healthcheck:

      test:

        [
          "CMD",
          "mysqladmin",
          "ping",
          "-uroot",
          "-prootsecret"
        ]

      interval: 10s

      timeout: 5s

      retries: 30
